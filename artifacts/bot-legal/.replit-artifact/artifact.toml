kind = "web"
previewPath = "/"
title = "Bot Legal Pages"
description = "A clean, beautiful Terms of Service and Privacy Policy website for a font-changing and copyright-checking bot. Features alternating cold and warm color sections, smooth transitions, and is fully Vercel-compatible."
version = "1.0.0"
id = "artifacts/bot-legal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19952

[services.development]
run = "pnpm --filter @workspace/bot-legal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bot-legal", "run", "build" ]
serve = "static"
publicDir = "artifacts/bot-legal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19952"
BASE_PATH = "/"
